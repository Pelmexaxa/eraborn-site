<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Игра: масштабирование страницы запрещено, вырез экрана учитывается. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Наследие эпох</title>
    <!-- Для веб-версии (GitHub Pages): описание для поиска и превью ссылок, значок вкладки и иконка на экран телефона.
         Пути от корня Vite переписывает под --base ./ (build:web). -->
    <meta name="description" content="Наследие эпох (Eraborn: Legacy) — карточная стратегия один на один: проведите державу через Античность, Средневековье и Индустриальную эпоху." />
    <meta name="theme-color" content="#0d0a07" />
    <!-- Превью ссылки (Reddit, Discord, Telegram, X): по-английски — ссылку несут в англоязычные сообщества. Картинка —
         public/og-image.jpg 1200×630 (из docs/promo/og.png, jpeg ≤ 300 КБ), адрес только полный: относительный превью не подхватывают.
         ?v= меняется вместе с картинкой: Telegram, Discord и Facebook держат превью по адресу. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Eraborn: Legacy" />
    <meta property="og:title" content="Eraborn: Legacy" />
    <meta property="og:description" content="1v1 strategy card game: lead a civilization through Antiquity, the Middle Ages and the Industrial era. Free, play in your browser." />
    <meta property="og:url" content="https://pelmexaxa.github.io/eraborn-site/" />
    <meta property="og:image" content="https://pelmexaxa.github.io/eraborn-site/og-image.jpg?v=0.7.2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Eraborn: Legacy, Joan of Arc against Nicholas II on the battlefield" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- Экран загрузки: виден сразу, ещё до скриптов и шрифтов игры. Убирает его App.vue, когда партия готова. -->
    <style>html,body{background:#0d0a07;height:100%;margin:0}#boot{z-index:1000;color:#f1dcaa;-webkit-user-select:none;user-select:none;background:radial-gradient(70% 60% at 50% 45%,#2a2016,#0d0a07);flex-direction:column;justify-content:center;align-items:center;gap:28px;font-family:Georgia,Times New Roman,serif;transition:opacity .45s ease-out;display:flex;position:fixed;inset:0}#boot.done{opacity:0;pointer-events:none}#boot .t{letter-spacing:.08em;text-transform:uppercase;text-shadow:0 3px #000,0 0 24px #ffbe5059;text-align:center;font-size:clamp(30px,6vw,54px);font-weight:700}#boot .gem{border:3px solid #c9a15a;width:26px;height:26px;animation:1.6s ease-in-out infinite bootSpin;transform:rotate(45deg);box-shadow:0 0 14px #c9a15a80}#boot .bar{background:#ffeecd1f;border-radius:2px;width:min(260px,60vw);height:4px;overflow:hidden}#boot .bar i{background:linear-gradient(90deg,#0000,#c9a15a,#0000);width:35%;height:100%;animation:1.3s ease-in-out infinite bootBar;display:block}#boot .bar i.det{background:linear-gradient(90deg,#8a6326,#f1dcaa);width:0;transition:width .25s ease-out;animation:none}@keyframes bootSpin{50%{transform:rotate(225deg)scale(.8)}to{transform:rotate(405deg)}}@keyframes bootBar{0%{transform:translate(-100%)}to{transform:translate(300%)}}@media (prefers-reduced-motion:reduce){#boot .gem,#boot .bar i{animation:none}}</style>
    <script type="module" crossorigin src="./assets/index-DlZDn4I8.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-fGFm2s8p.css">
  </head>

  <body>
    <div id="boot"><span class="gem"></span><span class="t" id="boot-t">Наследие эпох</span><span class="bar"><i></i></span></div>
    <script>try { if (localStorage.getItem('lang') === 'en') { document.getElementById('boot-t').textContent = 'Eraborn: Legacy'; document.title = 'Eraborn: Legacy'; document.documentElement.lang = 'en'; } } catch (e) {}</script>
    <div id="app"></div>
  </body>
</html>
