<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Игра: масштабирование страницы запрещено, вырез экрана учитывается. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Наследие эпох</title>
    <!-- Для веб-версии (GitHub Pages): описание для поиска и превью ссылок, значок вкладки и иконка на экран телефона.
         Пути от корня Vite переписывает под --base ./ (build:web). -->
    <meta name="description" content="Наследие эпох (Eraborn: Legacy) — карточная стратегия один на один: проведите державу через Античность, Средневековье и Индустриальную эпоху." />
    <meta name="theme-color" content="#0d0a07" />
    <!-- Превью ссылки (Reddit, Discord, Telegram, X): по-английски — ссылку несут в англоязычные сообщества. Картинка —
         public/og-image.jpg 1200×630 (из docs/promo/og.png, jpeg ≤ 300 КБ), адрес только полный: относительный превью не подхватывают.
         ?v= меняется вместе с картинкой: Telegram, Discord и Facebook держат превью по адресу. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Eraborn: Legacy" />
    <meta property="og:title" content="Eraborn: Legacy" />
    <meta property="og:description" content="1v1 strategy card game: lead a civilization through Antiquity, the Middle Ages and the Industrial era. Free, play in your browser." />
    <meta property="og:url" content="https://pelmexaxa.github.io/eraborn-site/" />
    <meta property="og:image" content="https://pelmexaxa.github.io/eraborn-site/og-image.jpg?v=0.7.2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Eraborn: Legacy, Joan of Arc against Nicholas II on the battlefield" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <!-- Экран загрузки: виден сразу, ещё до скриптов и шрифтов игры. Убирает его App.vue, когда партия готова. -->
    <style>html,body{background:#0d0a07;height:100%;margin:0}#boot{z-index:1000;color:#f1dcaa;-webkit-user-select:none;user-select:none;background:radial-gradient(58% 50% at 50% 44%,#42301e8c,#0000 70%),radial-gradient(80% 70%,#1b140e,#070504 78%);flex-direction:column;justify-content:center;align-items:center;gap:16px;font-family:Georgia,Times New Roman,serif;transition:opacity .45s ease-out;display:flex;position:fixed;inset:0}#boot.done{opacity:0;pointer-events:none}#boot .orn{align-items:center;gap:10px;display:flex}#boot .orn i{background:linear-gradient(90deg,#0000,#c9a15a);width:58px;height:2px}#boot .orn i:last-child{transform:scaleX(-1)}#boot .orn b{border:2px solid #c9a15a;width:11px;height:11px;transform:rotate(45deg)}#boot .t{letter-spacing:.08em;text-transform:uppercase;text-shadow:0 3px #000,0 0 24px #ffbe5059;text-align:center;font-size:clamp(30px,6vw,54px);font-weight:700}#boot .sub{letter-spacing:.18em;text-transform:uppercase;color:#9d8d74;font-size:11px}#boot .bar{background:#ffeecd1a;border-radius:2px;width:min(300px,64vw);height:5px;margin-top:8px;overflow:hidden;box-shadow:inset 0 1px 3px #000000b3}#boot .bar i{background:linear-gradient(90deg,#0000,#c9a15a,#0000);width:35%;height:100%;animation:1.3s ease-in-out infinite bootBar;display:block}#boot .bar i.det{background:linear-gradient(90deg,#8a6326,#f1dcaa);width:0;transition:width .25s ease-out;animation:none}@keyframes bootBar{0%{transform:translate(-100%)}to{transform:translate(300%)}}@media (prefers-reduced-motion:reduce){#boot .bar i{animation:none}}</style>
    <script type="module" crossorigin src="./assets/index-B_cXiDVI.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CWVHAuTn.css">
  </head>

  <body>
    <div id="boot">
      <span class="orn" aria-hidden="true"><i></i><b></b><i></i></span>
      <span class="t" id="boot-t">Наследие эпох</span>
      <span class="sub" id="boot-s">Собираем эпоху</span>
      <span class="bar"><i></i></span>
    </div>
    <script>try { if (localStorage.getItem('lang') === 'en') { document.getElementById('boot-t').textContent = 'Eraborn: Legacy'; document.getElementById('boot-s').textContent = 'Gathering the era'; document.title = 'Eraborn: Legacy'; document.documentElement.lang = 'en'; } } catch (e) {}</script>
    <div id="app"></div>
  </body>
</html>
